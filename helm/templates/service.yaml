apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default (include "hb-svc-notification.fullname" .) }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hb-svc-notification.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hb-svc-notification.selectorLabels" . | nindent 4 }}
