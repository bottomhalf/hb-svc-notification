replicaCount: 1

image:
  repository: bottomhalflimited/hb-svc-notification
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8107
  name: "notification-service"

namespace: hb
fullnameOverride: "notification-deployment"

env:
  profile: prod
  SPRING_PROFILES_ACTIVE: prod

configData:
  profile: prod
  SPRING_PROFILES_ACTIVE: prod

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# ==============================================================================
# Observability Configuration (OTel, Tempo, Loki, OTel Collector, Prometheus)
# ==============================================================================
# All observability operations are DISABLED by default.
# To easily re-enable: change `enabled: false` to `enabled: true`
# or run helm with `--set observability.enabled=true`
observability:
  enabled: false
  otel:
    enabled: true
    endpoint: "http://bt-otel-collector-helm.bt.svc.cluster.local:4317"
    protocol: "grpc"
    tracesExporter: "otlp"
    metricsExporter: "otlp"
    logsExporter: "otlp"
    javaagent:
      image: "busybox:latest"
      downloadUrl: "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar"
  prometheus:
    enabled: true
    path: "/actuator/prometheus"
  loki:
    enabled: true
