spring:
  cloud:
    config:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: bh-notification-group
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      properties:
        spring.json.trusted.packages: "com.bottomhalf.*"

    listener:
      ack-mode: manual


kafka:
  brokers:
    - localhost:9092
    - localhost:9093
    - localhost:9094
  topic:
    hb-post-event: hb-post-create-update-event
  group_id: bh-notification-group
  max_retries: 3

